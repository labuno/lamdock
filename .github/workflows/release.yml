name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without leading v, e.g. 0.4.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build macOS DMG (Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install npm dependencies
        run: |
          cd apps/desktop
          npm ci

      - name: Verify source and release versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node apps/desktop/scripts/verify-release-version.mjs

      - name: Shared release checks
        run: make check

      - name: Build DMG and Checksums
        run: make dmg

      - name: List generated DMG artifacts
        run: |
          ls -la apps/desktop/src-tauri/target/release/bundle/dmg/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-aarch64
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-dmg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: |
          echo "Artifacts to publish:"
          ls -la release-artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.dmg.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
